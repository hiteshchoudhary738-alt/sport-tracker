<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Directory — CricTrack</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand-logo">
        🏏 Cric<span class="green">Track</span>
      </a>

      <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">☰</button>

      <ul class="nav-menu" id="navMenu">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="matches.html" class="nav-link">Matches</a></li>
        <li><a href="players.html" class="nav-link active">Players</a></li>
        <li><a href="stats.html" class="nav-link">Stats Leaderboard</a></li>
      </ul>

      <div class="nav-right">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search player, match..." autocomplete="off">
          <div id="searchDropdown" class="search-dropdown"></div>
        </div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">☀️</button>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="main-content">
    <div class="section-header">
      <h1 class="section-title">Player Directory & Career Stats</h1>
    </div>

    <!-- Search & Role Filters Bar -->
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
      <div id="roleFilters" class="filter-tabs" style="margin-bottom: 0;">
        <button class="tab-btn active" onclick="filterPlayerRole('All', this)">All Roles</button>
        <button class="tab-btn" onclick="filterPlayerRole('Batsman', this)">Batsmen</button>
        <button class="tab-btn" onclick="filterPlayerRole('Bowler', this)">Bowlers</button>
        <button class="tab-btn" onclick="filterPlayerRole('All-rounder', this)">All-rounders</button>
        <button class="tab-btn" onclick="filterPlayerRole('Wicket-keeper', this)">Wicket-keepers</button>
      </div>

      <div style="position: relative; width: 260px;">
        <input type="text" id="playerSearchInput" class="form-control" placeholder="Search player name or country..." style="width: 100%; padding-left: 2rem;">
        <span style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);">🔍</span>
      </div>
    </div>

    <!-- Players Grid -->
    <div id="playersGrid" class="players-grid">
      <!-- Injected by players.js -->
    </div>
  </main>

  <!-- Player Profile Modal -->
  <div id="playerModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="playerModalTitle" class="modal-title">Player Profile</h3>
        <button class="modal-close" onclick="closePlayerModal()">&times;</button>
      </div>
      <div id="playerModalBody" class="modal-body">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;">
      <div>
        <strong style="color: var(--text-main);">CricTrack</strong> — Static Cricket Stats & Live Match Dashboard
      </div>
      <div>
        Data stored locally in browser via <code>localStorage</code>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/players.js"></script>
</body>
</html>
