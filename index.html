<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricTrack — Live Cricket Scores, Stats & Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        🏏 Cric<span class="green">Track</span>
      </a>

      <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">☰</button>

      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link active">Home</a></li>
        <li><a href="pages/matches.html" class="nav-link">Matches</a></li>
        <li><a href="pages/players.html" class="nav-link">Players</a></li>
        <li><a href="pages/stats.html" class="nav-link">Stats </a></li>
        <li><a href="pages/admin.html" class="nav-link">Admin Panel</a></li>
      </ul>

      <div class="nav-right">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search player, match..." autocomplete="off">
          <div id="searchDropdown" class="search-dropdown"></div>
        </div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Theme">☀️</button>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="main-content">
    
    <!-- Live Match Banner Container -->
    <section id="liveBannerSection" style="display: none;"></section>

    <!-- Matches Summary Section -->
    <section style="margin-bottom: 2.5rem;">
      <div class="section-header">
        <h2 class="section-title">Matches Dashboard</h2>
        <a href="pages/matches.html" style="font-size: 0.88rem; color: var(--accent-green); font-weight: 600;">View All Matches →</a>
      </div>

      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterHomeMatches('All', this)">All</button>
        <button class="tab-btn" onclick="filterHomeMatches('Live', this)">Live</button>
        <button class="tab-btn" onclick="filterHomeMatches('Upcoming', this)">Upcoming</button>
        <button class="tab-btn" onclick="filterHomeMatches('Completed', this)">Completed</button>
      </div>

      <div id="homeMatchesGrid" class="matches-grid">
      </div>
    </section>

    <!-- Two-Column Grid: News & Featured Players -->
    <div class="home-grid">
      <!-- Top News Headlines -->
      <section>
        <div class="section-header">
          <h2 class="section-title">Top Headlines</h2>
        </div>
        <div id="newsContainer">
        </div>
      </section>

      <!-- Featured Top Players -->
      <section>
        <div class="section-header">
          <h2 class="section-title">Top Players</h2>
          <a href="pages/players.html" style="font-size: 0.88rem; color: var(--accent-green); font-weight: 600;">All Players →</a>
        </div>
        <div id="featuredPlayersContainer" style="display: flex; flex-direction: column; gap: 1rem;">
        </div>
      </section>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;">
      <div>
        <strong style="color: var(--text-main);">CricTrack</strong> — Static Cricket Stats & Live Match Dashboard
      </div>
      <div>
        Data stored locally in browser via <code>localStorage</code>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadHomePageData();
    });

    let currentFilter = 'All';

    function loadHomePageData() {
      renderLiveBanner();
      renderHomeMatches();
      renderNews();
      renderFeaturedPlayers();
    }

    function renderLiveBanner() {
      const matches = CricData.getMatches();
      const liveMatch = matches.find(m => m.status === 'Live');
      const bannerSec = document.getElementById('liveBannerSection');

      if (!liveMatch) {
        bannerSec.style.display = 'none';
        return;
      }

      bannerSec.style.display = 'block';
      const live = liveMatch.liveData || {};
      const striker = live.currentBatsmen ? live.currentBatsmen.find(b => b.isStriker) || live.currentBatsmen[0] : null;
      const nonStriker = live.currentBatsmen ? live.currentBatsmen.find(b => !b.isStriker) || live.currentBatsmen[1] : null;
      const bowler = live.currentBowler || {};

      let ballsHtml = '';
      if (live.recentBalls && live.recentBalls.length) {
        ballsHtml = live.recentBalls.map(b => {
          let cls = '';
          if (b === '4') cls = 'four';
          else if (b === '6') cls = 'six';
          else if (b === 'W' || b === 'w') cls = 'wicket';
          return `<span class="ball-circle ${cls}">${b}</span>`;
        }).join('');
      }

      bannerSec.innerHTML = `
        <div class="live-banner">
          <div class="live-banner-header">
            <div style="display: flex; align-items: center; gap: 0.6rem;">
              <span class="badge badge-live"><span class="pulse-dot"></span> MATCH IN PROGRESS</span>
              <span style="font-size: 0.85rem; color: var(--text-muted);">${liveMatch.series}</span>
            </div>
            <a href="pages/matches.html?id=${liveMatch.id}" class="btn btn-primary" style="padding: 0.35rem 0.8rem; font-size: 0.8rem;">
              Full Scorecard →
            </a>
          </div>

          <div class="live-banner-body">
            <div>
              <div style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.3rem;">
                ${liveMatch.team1.flag} ${liveMatch.team1.shortName} ${liveMatch.team1Score.runs}/${liveMatch.team1Score.wickets} <span style="font-size: 1rem; color: var(--text-muted); font-weight: 500;">(${liveMatch.team1Score.overs} ov)</span>
              </div>
              <div style="font-size: 0.9rem; color: var(--accent-green); font-weight: 600; margin-bottom: 0.8rem;">
                ${liveMatch.resultText || liveMatch.tossInfo}
              </div>

              ${striker ? `
                <div style="display: flex; gap: 1.5rem; font-size: 0.9rem; margin-bottom: 0.4rem;">
                  <div><strong>${striker.name}*</strong>: ${striker.runs} (${striker.balls}b, 4s:${striker.fours}, 6s:${striker.sixes})</div>
                  ${nonStriker ? `<div><strong>${nonStriker.name}</strong>: ${nonStriker.runs} (${nonStriker.balls}b)</div>` : ''}
                </div>
              ` : ''}

              ${bowler.name ? `
                <div style="font-size: 0.85rem; color: var(--text-muted);">
                  <strong>${bowler.name}</strong>: ${bowler.wickets}/${bowler.runs} in ${bowler.overs} overs
                </div>
              ` : ''}
            </div>

            <div style="display: flex; flex-direction: column; justify-content: center;">
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Recent Overs</div>
              <div class="ball-tracker">${ballsHtml || 'No recent balls'}</div>
            </div>
          </div>
        </div>
      `;
    }

    function filterHomeMatches(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.filter-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHomeMatches();
    }

    function renderHomeMatches() {
      const matches = CricData.getMatches();
      const grid = document.getElementById('homeMatchesGrid');
      
      let filtered = matches;
      if (currentFilter !== 'All') {
        filtered = matches.filter(m => m.status === currentFilter);
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 2rem; text-align: center; color: var(--text-muted); background: var(--bg-card); border-radius: var(--radius-md);">No matches found for ${currentFilter}</div>`;
        return;
      }

      grid.innerHTML = filtered.map(m => renderMatchCardHTML(m, false)).join('');
    }

    function renderNews() {
      const news = CricData.getNews();
      const container = document.getElementById('newsContainer');

      container.innerHTML = news.map(n => `
        <div class="news-card">
          <img src="${n.image}" alt="${n.title}" class="news-img">
          <div class="news-content">
            <span class="news-cat">${n.category}</span>
            <div class="news-title">${n.title}</div>
            <div class="news-date">${n.date} • CricTrack Bureau</div>
          </div>
        </div>
      `).join('');
    }

    function renderFeaturedPlayers() {
      const players = CricData.getPlayers();
      const container = document.getElementById('featuredPlayersContainer');

      container.innerHTML = players.slice(0, 3).map(p => `
        <div class="player-card" onclick="window.location.href='pages/players.html?id=${p.id}'" style="display: flex; align-items: center; padding: 0.8rem 1rem; gap: 1rem;">
          <img src="${CricData.resolvePlayerPhoto(p.photo)}" alt="${p.name}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;" onerror="this.src='https://via.placeholder.com/50'">
          <div style="flex: 1;">
            <div style="font-weight: 700; font-size: 0.95rem;">${p.name}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">${p.country} • ${p.role}</div>
          </div>
          <div style="text-align: right;">
            <div style="font-weight: 800; color: var(--accent-green); font-size: 1.05rem;">
              ${p.role.includes('Bowler') ? p.stats.ODI.wickets + ' wkt' : p.stats.ODI.runs + ' runs'}
            </div>
            <div style="font-size: 0.72rem; color: var(--text-muted);">ODI Career</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
